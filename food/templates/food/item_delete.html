{% extends 'food/base.html' %}
{% load static %}

{% block title %}Delete Item{% endblock %}

{% block body %}
<div class="delete-wrapper">
    <div class="delete-card">
        <div class="delete-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#c6a15b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
        </div>
        
        <h2 class="delete-title">Are you sure?</h2>
        <p class="delete-message">
            You are about to delete <strong>{{ item.item_name }}</strong>
        </p>
        <p class="delete-warning">This action cannot be undone</p>
        
        <form method="POST" class="delete-form">
            {% csrf_token %}
            <div class="delete-actions">
                <a href="{% url 'food:index' %}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-delete">Delete</button>
            </div>
        </form>
    </div>
</div>

<style>
    .delete-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 1rem;
        pointer-events: none;
    }

    .delete-card {
        pointer-events: auto;
        background: rgba(20, 16, 12, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(198, 161, 91, 0.15);
        border-radius: 24px;
        padding: 3rem 3.5rem;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        transition: all 0.3s ease;
    }

    .delete-card:hover {
        border-color: rgba(198, 161, 91, 0.3);
        box-shadow: 0 24px 72px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(198, 161, 91, 0.06);
    }

    .delete-icon {
        margin-bottom: 1.5rem;
        display: flex;
        justify-content: center;
        opacity: 0.7;
    }

    .delete-title {
        font-family: 'Inter', sans-serif;
        font-size: 1.75rem;
        font-weight: 600;
        color: #e8e0d5;
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
    }

    .delete-message {
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        color: rgba(232, 224, 213, 0.7);
        margin-bottom: 0.5rem;
        line-height: 1.6;
    }

    .delete-message strong {
        color: #c6a15b;
        font-weight: 500;
    }

    .delete-warning {
        font-family: 'Inter', sans-serif;
        font-size: 0.8rem;
        color: rgba(232, 224, 213, 0.3);
        margin-bottom: 2rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    .delete-form {
        display: flex;
        justify-content: center;
    }

    .delete-actions {
        display: flex;
        gap: 1rem;
        width: 100%;
    }

    .btn-cancel {
        flex: 1;
        padding: 0.75rem 1.5rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 50px;
        color: rgba(232, 224, 213, 0.6);
        text-decoration: none;
        font-family: 'Inter', sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        transition: all 0.25s ease;
        text-align: center;
        letter-spacing: 0.02em;
    }

    .btn-cancel:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
        color: #e8e0d5;
        text-decoration: none;
    }

    .btn-delete {
        flex: 1;
        padding: 0.75rem 1.5rem;
        background: rgba(198, 161, 91, 0.15);
        border: 1px solid rgba(198, 161, 91, 0.25);
        border-radius: 50px;
        color: #c6a15b;
        font-family: 'Inter', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
        letter-spacing: 0.02em;
        text-transform: uppercase;
    }

    .btn-delete:hover {
        background: rgba(198, 161, 91, 0.25);
        border-color: rgba(198, 161, 91, 0.4);
        box-shadow: 0 0 30px rgba(198, 161, 91, 0.1);
        transform: scale(1.02);
    }

    .btn-delete:active {
        transform: scale(0.98);
    }

    /* Mobile responsive */
    @media (max-width: 576px) {
        .delete-card {
            padding: 2rem 1.5rem;
            margin: 0 1rem;
        }

        .delete-title {
            font-size: 1.4rem;
        }

        .delete-actions {
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn-cancel,
        .btn-delete {
            padding: 0.7rem 1.2rem;
            font-size: 0.85rem;
        }
    }
</style>
{% endblock %}
