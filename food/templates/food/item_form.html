{% extends 'food/base.html' %}
{% block body %}

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');

  .form-wrapper {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8f7f4;
    padding: 2rem;
  }

  .form-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 3rem 2.5rem;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 4px 32px rgba(0,0,0,0.08);
  }

  .form-divider {
    width: 40px;
    height: 3px;
    background: #d4845a;
    border-radius: 2px;
    margin-bottom: 1.5rem;
  }

  .form-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: #1a1a1a;
    margin-bottom: 0.25rem;
  }

  .form-subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: #888;
    margin-bottom: 2rem;
  }

  .form-card label {
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: block;
    margin-bottom: 0.35rem;
    margin-top: 1.2rem;
  }

  .form-card input,
  .form-card textarea,
  .form-card select {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    color: #1a1a1a;
    background: #fafafa;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    box-sizing: border-box;
  }

  .form-card input:focus,
  .form-card textarea:focus,
  .form-card select:focus {
    border-color: #d4845a;
    box-shadow: 0 0 0 3px rgba(212, 132, 90, 0.12);
    background: #fff;
  }

  .form-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.75rem;
  }

  .btn-save {
    flex: 1;
    padding: 0.85rem;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: background 0.2s;
  }

  .btn-save:hover {
    background: #d4845a;
  }

  .btn-cancel {
    padding: 0.85rem 1.5rem;
    background: transparent;
    color: #888;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    transition: border-color 0.2s, color 0.2s;
  }

  .btn-cancel:hover {
    border-color: #1a1a1a;
    color: #1a1a1a;
  }
</style>

<div class="form-wrapper">
  <div class="form-card">
    <div class="form-divider"></div>
    <h1 class="form-title">Add food item</h1>
    <p class="form-subtitle">Fill in the details below to add a new item</p>

    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <button type="submit" class="btn-save">Save item</button>
        <a href="{% url 'food:index' %}" class="btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
