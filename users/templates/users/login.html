{% extends 'food/base.html' %}
{% block body %}

<style>
    .auth-wrapper {
        background: #0c0a09;
        min-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
    }

    .auth-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 8px 48px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(198, 161, 91, 0.06);
        position: relative;
        overflow: hidden;
    }

    .auth-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #c6a15b, #dbb87a, #c6a15b, transparent);
        opacity: 0.3;
    }

    .auth-divider {
        width: 40px;
        height: 3px;
        background: linear-gradient(90deg, #c6a15b, transparent);
        border-radius: 4px;
        margin-bottom: 1.5rem;
    }

    .auth-title {
        font-family: 'Playfair Display', serif;
        font-size: 2rem;
        color: #e8e0d5;
        margin-bottom: 0.25rem;
        letter-spacing: -0.01em;
    }

    .auth-subtitle {
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        color: rgba(232, 224, 213, 0.2);
        margin-bottom: 2rem;
        letter-spacing: 0.04em;
    }

    .auth-card label {
        font-family: 'Inter', sans-serif;
        font-size: 0.7rem;
        font-weight: 600;
        color: rgba(232, 224, 213, 0.2);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        display: block;
        margin-bottom: 0.35rem;
        margin-top: 1.2rem;
    }

    .auth-card input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1.5px solid rgba(198, 161, 91, 0.06);
        border-radius: 12px;
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
        color: #e8e0d5;
        background: rgba(255, 255, 255, 0.02);
        transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        outline: none;
        box-sizing: border-box;
    }

    .auth-card input:focus {
        border-color: rgba(198, 161, 91, 0.25);
        box-shadow: 0 0 0 3px rgba(198, 161, 91, 0.04);
        background: rgba(255, 255, 255, 0.04);
    }

    .auth-card input::placeholder {
        color: rgba(232, 224, 213, 0.06);
    }

    .auth-card .helptext {
        font-family: 'Inter', sans-serif;
        font-size: 0.7rem;
        color: rgba(232, 224, 213, 0.1);
        margin-top: 0.3rem;
        display: block;
    }

    .auth-card ul {
        font-family: 'Inter', sans-serif;
        font-size: 0.7rem;
        color: rgba(212, 122, 122, 0.5);
        margin: 0.3rem 0 0 1rem;
        padding: 0;
        list-style: none;
    }

    .auth-card ul li {
        margin-bottom: 0.2rem;
    }

    .auth-btn {
        width: 100%;
        padding: 0.85rem;
        background: linear-gradient(135deg, #c6a15b, #a8844a);
        color: #0c0a09;
        border: none;
        border-radius: 30px;
        font-family: 'Inter', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        margin-top: 1.75rem;
        cursor: pointer;
        letter-spacing: 0.04em;
        transition: all 0.4s ease;
        box-shadow: 0 4px 16px rgba(198, 161, 91, 0.15);
    }

    .auth-btn:hover {
        background: linear-gradient(135deg, #dbb87a, #c6a15b);
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(198, 161, 91, 0.25);
        color: #0a0807;
    }

    .auth-footer {
        font-family: 'Inter', sans-serif;
        font-size: 0.8rem;
        color: rgba(232, 224, 213, 0.15);
        text-align: center;
        margin-top: 1.5rem;
        letter-spacing: 0.02em;
    }

    .auth-footer a {
        color: #c6a15b;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s ease;
    }

    .auth-footer a:hover {
        color: #dbb87a;
        text-decoration: underline;
    }

    /* غیرفعال کردن استایل‌های پیش‌فرض برودت */
    .auth-card .errorlist {
        list-style: none;
        padding: 0;
        margin: 0.5rem 0;
    }

    .auth-card .errorlist li {
        font-family: 'Inter', sans-serif;
        font-size: 0.75rem;
        color: rgba(212, 122, 122, 0.6);
    }

    @media (max-width: 480px) {
        .auth-card { padding: 2rem 1.25rem; border-radius: 18px; }
        .auth-title { font-size: 1.6rem; }
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-divider"></div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your account</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="auth-btn">Sign in</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Create one</a>
        </p>
    </div>
</div>

{% endblock %}
